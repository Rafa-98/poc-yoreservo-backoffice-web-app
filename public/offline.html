<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1F290F" />
    <title>Sin conexión | YoReservo BackOffice</title>
    <link rel="icon" href="/icons/icon-192x192.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f140c;
        --surface: #171f12;
        --surface-elevated: #1f290f;
        --border: rgba(198, 242, 59, 0.16);
        --text: #f4f7f2;
        --muted: #9aa894;
        --accent: #c6f23b;
        --accent-fg: #141b09;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(198, 242, 59, 0.12) 0%,
            transparent 55%
          ),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: 2.25rem 1.75rem;
        text-align: center;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }

      .badge-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(198, 242, 59, 0.12);
        border: 1px solid rgba(198, 242, 59, 0.28);
        color: var(--accent);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 1.25rem;
      }

      .icon-shell {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
      }

      h1 {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.65rem;
      }

      p {
        font-size: 0.9rem;
        line-height: 1.55;
        color: var(--muted);
        margin-bottom: 1.75rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .btn-primary {
        appearance: none;
        width: 100%;
        border: none;
        border-radius: 0.875rem;
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.875rem 1.25rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition:
          transform 0.12s ease,
          filter 0.15s ease;
      }

      .btn-primary:hover {
        filter: brightness(1.05);
      }

      .btn-primary:active {
        transform: scale(0.98);
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border-radius: 0.875rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 0.825rem;
        font-weight: 600;
        padding: 0.75rem 1rem;
      }

      .meta {
        margin-top: 1.5rem;
        padding-top: 1.15rem;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge-wrap">
        <span>YR BackOffice • Modo Offline</span>
      </div>

      <div class="icon-shell" aria-hidden="true">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>Sin conexión a Internet</h1>
      <p>
        Tu dispositivo no tiene conexión en este momento. Verifica tu red Wi‑Fi
        o datos móviles para sincronizar la agenda multi-cancha, reservas y
        conciliación BCV.
      </p>

      <div class="actions">
        <button
          type="button"
          class="btn-primary"
          onclick="window.location.reload()"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          <span>Reintentar conexión</span>
        </button>
        <a href="/dashboard" class="btn-secondary">Ir al Panel Ejecutivo</a>
      </div>

      <div class="meta">
        YoReservo BackOffice • Gestión de Clubes y Tesorería
      </div>
    </main>

    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
